name: Native iOS
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project with non-production configuration
        working-directory: ios
        run: |
          cp Nadorio/Resources/Configuration.example.plist Nadorio/Resources/Configuration.plist
          xcodegen generate
      - name: Build and test on iPhone simulator
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for vs in d["devices"].values() for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild test -project Nadorio.xcodeproj -scheme Nadorio -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/build/TestResults.xcresult
