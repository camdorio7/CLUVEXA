name: Nadorio
options:
  bundleIdPrefix: com.cd7technologies
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: NO
targets:
  Nadorio:
    type: application
    platform: iOS
    sources:
      - path: Nadorio
        excludes: [Resources]
      - path: Nadorio/Resources
        buildPhase: resources
        excludes: [Configuration.example.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cd7technologies.nadorio
        INFOPLIST_FILE: Info.plist
    scheme:
      testTargets: [NadorioTests]
  NadorioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NadorioTests]
    dependencies:
      - target: Nadorio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
